apiVersion: batch/v1
kind: Job
metadata:
  name: stage-hf-minimax-h3
  namespace: default
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: stage-hf-minimax-h3
    spec:
      serviceAccountName: default
      restartPolicy: OnFailure
      nodeSelector:
        cloud.google.com/gke-nodepool: default-pool
      containers:
      - name: streamer
        image: python:3.11-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -euo pipefail
          pip install --no-cache-dir -q huggingface_hub google-cloud-storage requests
          python3 - <<'PY'
          import concurrent.futures, os, time
          import requests
          from google.cloud import storage
          from huggingface_hub import HfApi, hf_hub_url

          repo_id = "MiniMaxAI/MiniMax-H3"
          bucket_name = "YOUR_GCS_BUCKET"
          prefix = "models"
          hf_token = os.environ.get("HF_TOKEN")
          allow_prefixes = (
              "transformer/",
              "vae/",
              "audio_vae/",
              "scheduler/",
              "audio_scheduler/",
              "tokenizer/",
              "processor/",
              "model_index.json",
              "modular_model_index.json",
              "README.md",
          )

          api = HfApi(token=hf_token)
          info = api.repo_info(repo_id=repo_id, repo_type="model", files_metadata=True)
          siblings = [
              s for s in info.siblings
              if any(s.rfilename == p or s.rfilename.startswith(p) for p in allow_prefixes)
          ]
          # Prioritize transformer/ shards first!
          siblings.sort(key=lambda s: (0 if s.rfilename.startswith("transformer/") else 1, s.rfilename))
          total_bytes = sum((s.size or 0) for s in siblings)
          print(f"[stage-minimax-h3] Streaming {len(siblings)} files ({total_bytes/1e9:.2f} GB) -> gs://{bucket_name}/{prefix}/{repo_id}/", flush=True)

          def xfer(s):
              client = storage.Client()
              blob = client.bucket(bucket_name).blob(f"{prefix}/{repo_id}/{s.rfilename}")
              if blob.exists():
                  blob.reload()
                  if (s.size or 0) > 0 and blob.size == s.size:
                      return (s.rfilename, "SKIP", blob.size)
              url = hf_hub_url(repo_id=repo_id, filename=s.rfilename)
              headers = {"Authorization": f"Bearer {hf_token}"} if hf_token else {}
              t0 = time.time()
              written = 0
              for attempt in range(1, 4):
                  try:
                      with requests.get(url, headers=headers, stream=True, timeout=180) as resp:
                          resp.raise_for_status()
                          with blob.open("wb", chunk_size=64 * 1024 * 1024) as f:
                              for chunk in resp.iter_content(chunk_size=16 * 1024 * 1024):
                                  if chunk:
                                      f.write(chunk)
                                      written += len(chunk)
                      dt = max(time.time() - t0, 1e-3)
                      print(f"[stage-minimax-h3] DONE {s.rfilename} ({written/1e9:.2f} GB in {dt:.1f}s = {(written/1048576)/dt:.1f} MiB/s)", flush=True)
                      return (s.rfilename, "OK", written)
                  except Exception as exc:
                      print(f"[stage-minimax-h3] WARN {s.rfilename} attempt {attempt}: {exc}", flush=True)
                      written = 0
                      if attempt == 3:
                          raise
                      time.sleep(4 * attempt)

          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as pool:
              futs = [pool.submit(xfer, s) for s in siblings]
              for i, fut in enumerate(concurrent.futures.as_completed(futs), 1):
                  fut.result()
                  if i % 5 == 0 or i == len(siblings):
                      print(f"[stage-minimax-h3] Progress: {i}/{len(siblings)} files complete", flush=True)

          storage.Client().bucket(bucket_name).blob(f"{prefix}/{repo_id}/_STAGE_COMPLETE.txt").upload_from_string("ok\n")
          print("[stage-minimax-h3] ALL FILES STAGED!", flush=True)
          PY
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
        resources:
          requests:
            cpu: "1000m"
            memory: "2Gi"
          limits:
            cpu: "3500m"
            memory: "6Gi"
