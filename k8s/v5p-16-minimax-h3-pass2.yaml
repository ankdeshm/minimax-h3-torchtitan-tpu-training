apiVersion: v1
kind: Service
metadata:
  name: minimax-h3-v5p-16-pass2-svc
  namespace: default
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    job-name: minimax-h3-v5p-16-pass2
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minimax-h3-v5p-16-pass2
  namespace: default
spec:
  completions: 4
  parallelism: 4
  completionMode: Indexed
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: minimax-h3-v5p-16-pass2
      annotations:
        gke-gcsfuse/volumes: "true"
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      serviceAccountName: default
      subdomain: minimax-h3-v5p-16-pass2-svc
      terminationGracePeriodSeconds: 5
      restartPolicy: OnFailure
      nodeSelector:
        cloud.google.com/gke-nodepool: tpu-v5p-16-pool
        cloud.google.com/gke-tpu-accelerator: tpu-v5p-slice
        cloud.google.com/gke-tpu-topology: 2x2x4
      tolerations:
      - key: "google.com/tpu"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "cloud.google.com/gke-spot"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: trainer
        image: us-central1-docker.pkg.dev/YOUR_GCP_PROJECT_ID/torchtpu/torchtitan-flint:v0.2.0
        imagePullPolicy: IfNotPresent
        command: ["python3", "/scripts/run_minimax_h3_v5p16_sweep.py"]
        args:
        - --accel=v5p
        - --topology=2x2x4
        - --nnodes=4
        - --nproc-per-node=4
        - --nodepool=tpu-v5p-16-pool
        - --checkpoint-dir=/models/models/MiniMaxAI/MiniMax-H3/transformer
        - --results-root=/models/minimax-h3-results
        - --pass-name=pass2f
        env:
        - name: MASTER_ADDR
          value: "minimax-h3-v5p-16-pass2-0.minimax-h3-v5p-16-pass2-svc.default.svc.cluster.local"
        - name: MASTER_PORT
          value: "29510"
        - name: PJRT_DEVICE
          value: "TPU"
        resources:
          requests:
            google.com/tpu: "4"
          limits:
            google.com/tpu: "4"
        volumeMounts:
        - name: models-gcs
          mountPath: /models
        - name: mh3-script
          mountPath: /scripts
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
      - name: models-gcs
        persistentVolumeClaim:
          claimName: tpu-models-gcs-pvc
      - name: mh3-script
        configMap:
          name: minimax-h3-v5p16-script
